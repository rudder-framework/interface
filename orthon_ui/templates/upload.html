<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orthon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a; color: #e0e0e0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }
  .container { text-align: center; max-width: 480px; padding: 2rem; }
  h1 { font-size: 2rem; font-weight: 300; letter-spacing: 0.15em; margin-bottom: 2.5rem; }
  h1 span { color: #6ea8fe; }
  .dropzone {
    border: 2px dashed #333; border-radius: 12px; padding: 3rem 2rem;
    cursor: pointer; transition: border-color 0.2s, background 0.2s;
  }
  .dropzone.over { border-color: #6ea8fe; background: rgba(110,168,254,0.05); }
  .dropzone p { font-size: 1rem; color: #888; margin-bottom: 0.5rem; }
  .dropzone .hint { font-size: 0.8rem; color: #555; }
  input[type="file"] { display: none; }
  .filename { margin-top: 1.5rem; font-size: 0.9rem; color: #6ea8fe; min-height: 1.4em; }
  button {
    margin-top: 1.5rem; padding: 0.75rem 2.5rem;
    background: #6ea8fe; color: #0a0a0a; border: none; border-radius: 8px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    opacity: 0.3; pointer-events: none; transition: opacity 0.2s;
  }
  button.ready { opacity: 1; pointer-events: auto; }
  button.ready:hover { background: #93c0ff; }
</style>
</head>
<body>
<div class="container">
  <h1><span>&Oslash;</span>rthon Analytics</h1>
  <div class="dropzone" id="dropzone">
    <p>Drop data file here</p>
    <p class="hint">CSV, Parquet, TXT, TSV, Excel, JSON, MAT, HDF5</p>
    <p class="hint hint-browse">or click to browse</p>
  </div>
  <input type="file" id="fileinput" accept=".csv,.parquet,.pq,.txt,.tsv,.xlsx,.xls,.json,.mat,.hdf5,.h5">
  <div class="filename" id="filename"></div>
  <button id="start">Start Analysis</button>
</div>
<script>
  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileinput');
  const fn = document.getElementById('filename');
  const btn = document.getElementById('start');
  let file = null;

  dz.addEventListener('click', () => fi.click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('over');
    pick(e.dataTransfer.files[0]);
  });
  fi.addEventListener('change', () => pick(fi.files[0]));

  function pick(f) {
    if (!f) return;
    file = f;
    fn.textContent = f.name;
    btn.classList.add('ready');
  }

  btn.addEventListener('click', async () => {
    if (!file) return;
    btn.textContent = 'Uploading\u2026';
    btn.classList.remove('ready');
    const form = new FormData();
    form.append('file', file);
    const res = await fetch('/upload', { method: 'POST', body: form });
    const data = await res.json();
    window.location.href = '/results/' + data.job_id;
  });
</script>
</body>
</html>
